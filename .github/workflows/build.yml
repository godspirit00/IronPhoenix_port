name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLVM_MINGW: llvm-mingw-20261006-ucrt-x86_64
  LLVM_MINGW_TAG: "20261006"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: toolchain/${{ env.LLVM_MINGW }}
          key: ${{ env.LLVM_MINGW }}

      - name: Download llvm-mingw
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          curl -fsSL --retry 5 -o tc.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/${LLVM_MINGW}.zip"
          7z x -y -otoolchain tc.zip > /dev/null
          rm tc.zip

      - name: Build
        run: ./build.sh

      - name: Package
        id: pkg
        run: |
          SHORT=${GITHUB_SHA::7}
          mkdir -p dist/ironphoenix/game
          cp build/ironphoenix.exe README.md LICENSE dist/ironphoenix/
          echo "Copy the contents of your Iron Phoenix disc (default.xbe, Chara, Model, ...) into this folder." > dist/ironphoenix/game/PUT_GAME_FILES_HERE.txt
          (cd dist && 7z a -tzip ../ironphoenix-nightly.zip ironphoenix > /dev/null)
          echo "short=$SHORT" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ironphoenix-${{ steps.pkg.outputs.short }}
          path: ironphoenix-nightly.zip

      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Automated build of \`main\` at ${GITHUB_SHA} ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "Latest change:"
            echo
            git log -1 --format='> %s'
            echo
            echo "Game files are **not** included; see README.md."
          } > notes.md
          # Replace the previous nightly: drop the old release and its tag, then recreate at this commit.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly ironphoenix-nightly.zip \
            --target "$GITHUB_SHA" \
            --title "Nightly (${{ steps.pkg.outputs.short }})" \
            --notes-file notes.md \
            --latest
